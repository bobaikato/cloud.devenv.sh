name: Test Ota Contract Matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ota.yaml
      - .github/workflows/test-ota-contract-matrix.yml
  push:
    paths:
      - ota.yaml
      - .github/workflows/test-ota-contract-matrix.yml

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: "1"

jobs:
  matrix:
    name: Ota Contract Matrix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-native
            os: ubuntu-latest
            proof_lane: true
          - name: macos-native
            os: macos-latest
            proof_lane: false

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install nix
        uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31

      - name: Set up ota
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml

      - name: Verify contracted Ota release
        shell: bash
        run: |
          ota --version | tee ota-version.txt
          ota --version | rg -q '1\\.6\\.25'

      - name: Validate contract
        shell: bash
        run: |
          ota validate --json . > ota-validate.json
          ota validate .

      - name: List task and workflow surfaces
        shell: bash
        run: |
          ota tasks --use .
          ota tasks --safe --use .
          ota workflows .

      - name: Preview doctor fix surface
        shell: bash
        run: |
          status=0
          ota doctor --fix --dry-run --json . > ota-doctor-fix-preview.json || status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Apply doctor fix surface
        timeout-minutes: 60
        shell: bash
        run: |
          ota doctor --fix --json . > ota-doctor-fix.json
          ota doctor --fix .

      - name: Doctor contract
        shell: bash
        run: ota doctor .

      - name: Export execution topology
        shell: bash
        run: ota execution topology --json . > ota-execution-topology.json

      - name: Dry-run public task surface
        shell: bash
        run: |
          ota run test --native --dry-run .
          ota run verify --native --dry-run .
          ota run dev --native --dry-run .

      - name: Dry-run verify workflow
        shell: bash
        run: ota up --workflow verify --native --dry-run .

      - name: Execute public finite task surface
        if: matrix.proof_lane
        timeout-minutes: 180
        shell: bash
        run: ota run test --native --stream .

      - name: Execute verify workflow
        if: matrix.proof_lane
        timeout-minutes: 180
        shell: bash
        run: ota up --workflow verify --native --stream .

      - name: Upload Ota matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ota-contract-matrix-${{ matrix.name }}
          path: |
            ota-version.txt
            ota-validate.json
            ota-doctor-fix-preview.json
            ota-doctor-fix.json
            ota-execution-topology.json
            .ota/receipts
            .ota/proof
          if-no-files-found: error
