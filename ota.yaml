version: 1
project:
  name: cloud.devenv.sh
  description: Cloud-hosted devenv platform pressure slice with nix-owned bootstrap and devenv-owned execution
  type: application

execution:
  preferred: native
  supported:
    - native

tools:
  nix: "*"

orchestrators:
  devenv:
    kind: devenv
    required: true
    config_files:
      - devenv.nix
    launcher:
      exe: nix
      args:
        - run
        - github:cachix/devenv/65a7c40d185350f0e96783b3dd8d4afab3bb7034#devenv
        - --

tasks:
  test:
    category: test
    description: Run the repo's canonical devenv verification lane.
    command:
      exe: test
    execution:
      orchestrator:
        ref: devenv
        mode: subcommand
    requirements:
      tools:
        nix: "*"
    notes: |
      This pressure fixture pins the devenv launcher to the same revision recorded in
      `devenv.lock`: `nix run github:cachix/devenv/65a7c40d185350f0e96783b3dd8d4afab3bb7034#devenv -- test`.
      This contract models that directly as an orchestrator-owned launcher plus a direct
      orchestrator subcommand lane, so Ota requires `nix` on the host instead of pretending
      `devenv` must already exist on PATH.

  dev:
    category: dev
    description: Start the local multi-process development environment.
    launch:
      kind: command
      exe: up
    execution:
      orchestrator:
        ref: devenv
        mode: subcommand
    requirements:
      tools:
        nix: "*"
    notes: |
      This repo's local development surface is `devenv up`, so the long-running lane stays on
      `launch.kind: command` while the actual `devenv` reachability stays owned by the
      orchestrator launcher.

  verify:
    category: test
    description: Run the canonical verification surface for the pressure slice.
    aggregate:
      tasks:
        - test
    notes: |
      This keeps one verification entrypoint without inventing a no-op shell wrapper.

workflows:
  default: verify
  verify:
    description: Canonical contributor verification path for cloud.devenv.sh.
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` to run the repo's devenv-backed verification path.

agent:
  posture: readiness_strict
  writable_paths:
    - backend
    - cloud-hypervisor-client
    - frontend
    - init
    - logger
    - runner
    - terraform
  protected_paths:
    - .github/workflows
    - Cargo.lock
    - devenv.nix
    - ota.yaml
  bootstrap:
    ota:
      note: Only install released Ota v1.6.26 if it is missing and installation is approved.
      source:
        kind: version
        version: v1.6.26
  notes: |
    Start with `ota validate`, then `ota tasks --use`, then `ota run verify --dry-run`.
    This repo's environment truth belongs to the `devenv` orchestrator, while `nix` remains the
    host launcher owner on a clean machine.
